primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  CHEEKYCMS_CONTENT_ROOT = "/app/content"
  CHEEKYCMS_HOST = "0.0.0.0"
  CHEEKYCMS_PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
